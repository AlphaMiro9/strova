<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b12">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Strova – YouTube ohne Tracking, mit eigenem Player und Stimmungen.">
  <title>Strova</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="music.css">
  <script>
    try { var t = JSON.parse(localStorage.getItem('strova.settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="Strova Startseite">
      <img src="icons/icon.svg" alt="" width="30" height="30"><span>Strova</span>
    </a>
    <form id="searchForm" class="search" role="search" autocomplete="off">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
      <input id="searchInput" type="search" placeholder="Videos, Kanäle, Musik …" enterkeyhint="search" aria-label="Suchen">
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>
    <button id="themeBtn" class="icon-btn" aria-label="Hell/Dunkel wechseln" title="Hell/Dunkel">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
  </header>

  <nav class="nav" id="nav" aria-label="Hauptnavigation">
    <a href="#/" data-route="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6.5v-6h5v6H21V10.5z"/></svg><span>Entdecken</span></a>
    <a href="#/music" data-route="music"><svg viewBox="0 0 24 24"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h7v6.6A3.5 3.5 0 1 0 20 18V3H9Z"/></svg><span>Musik</span></a>
    <a href="#/moods" data-route="moods"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-3.5 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 18a5.5 5.5 0 0 1-5-3.2h10A5.5 5.5 0 0 1 12 18Z"/></svg><span>Stimmungen</span></a>
    <a href="#/feed" data-route="feed"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg><span>Abos</span></a>
    <a href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M5 3h14a1 1 0 0 1 1 1v17l-8-4-8 4V4a1 1 0 0 1 1-1Z"/></svg><span>Sammlung</span></a>
    <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg><span>Einstellungen</span></a>
  </nav>

  <main id="view" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/piped.js"></script>
  <script src="js/player.js"></script>
  <script src="js/yt.js"></script>
  <script src="js/music.js"></script>
  <script src="js/app.js"></script>
  <script src="js/update.js"></script>
</body>
</html>
